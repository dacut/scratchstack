[package]
name = "scratchstack-core"
description = "Core utilities for Scatchstack services"

authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true

[features]
default = ["axum", "tls"]
axum = ["dep:axum"]
tls = ["axum", "dep:tokio-rustls", "tokio/net"]

[dependencies]
axum = { workspace = true, optional = true }
base64.workspace = true
bon.workspace = true
bytes.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
log.workspace = true
quick-xml = { workspace = true, features = ["serialize"] }
rand = { workspace = true, features = ["std", "std_rng"] }
scratchstack-arn = { path = "../scratchstack-arn", optional = true }
scratchstack-aws-principal.path = "../scratchstack-aws-principal"
scratchstack-hakari.path = "../scratchstack-hakari"
serde = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, optional = true, features = [
    "all-databases",
    "chrono",
    "macros",
    "migrate",
    "runtime-tokio",
    "tls-rustls",
] }
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-rustls = { workspace = true, optional = true }
tower.workspace = true
uuid = { workspace = true, features = ["serde", "v7"] }

[dev-dependencies]
env_logger.workspace = true
http-body-util.workspace = true
pretty_assertions.workspace = true
regex.workspace = true
test-log.workspace = true
