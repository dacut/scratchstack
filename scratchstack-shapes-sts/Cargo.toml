[package]
name = "scratchstack-shapes-sts"
description = "AWS Security Token Service shapes for Scratchstack services"

authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true

[features]
default = ["clap"]
clap = ["dep:clap", "dep:scratchstack-cli-utils"]

[build-dependencies]
anyhow.workspace = true
scratchstack-shapegen = { path = "../scratchstack-shapegen" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dependencies]
anyhow.workspace = true
bon.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, optional = true, features = ["derive"] }
log.workspace = true
regex.workspace = true
scratchstack-cli-utils = { workspace = true, optional = true }
scratchstack-core.workspace = true
scratchstack-hakari.workspace = true
scratchstack-shapes-iam.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
chrono = { workspace = true, features = ["clock"] }
anyhow.workspace = true
regex.workspace = true
test-log.workspace = true
