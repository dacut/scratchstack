[package]
name = "scratchstack-aws-signature"
description = "AWS SigV4 signature verification"
exclude = ["tests/*"]
keywords = ["AWS", "Amazon", "SigV4"]
readme = "README.md"

authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true

[lib]
name = "scratchstack_aws_signature"

[features]
default = ["axum", "default_session_token"]
axum = ["dep:axum"]
default_session_token = ["dep:aes", "dep:aes-gcm", "dep:base64", "dep:postcard"]
unstable = []

[dependencies]
aes = { workspace = true, optional = true, features = ["zeroize"] }
aes-gcm = { workspace = true, optional = true, features = ["zeroize"] }
ascii-casing = { workspace = true, features = ["serde"] }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
derive_builder.workspace = true
encoding_rs.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
lazy_static.workspace = true
log.workspace = true
postcard = { workspace = true, optional = true, features = ["alloc"] }
qualifier_attr.workspace = true
rand.workspace = true
regex.workspace = true
sha2.workspace = true
scratchstack-arn.path = "../scratchstack-arn"
scratchstack-aspen.path = "../scratchstack-aspen"
scratchstack-aws-principal = { path = "../scratchstack-aws-principal", features = [
    "serde",
] }
scratchstack-errors.path = "../scratchstack-errors"
scratchstack-hakari = { path = "../scratchstack-hakari" }
serde = { workspace = true, features = ["derive"] }
subtle.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }
tower = { workspace = true, features = ["util"] }
zeroize = { workspace = true, features = ["zeroize_derive"] }

[dev-dependencies]
axum.workspace = true
env_logger.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tokio-test.workspace = true
test-log.workspace = true
