[package]
name = "scratchstack-shapes-cloud"
description = "Shapes for the Scratchstack Cloud Service"

authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true

[features]
default = ["clap"]
clap = ["dep:clap", "dep:scratchstack-cli-utils"]

[build-dependencies]
anyhow.workspace = true
scratchstack-shapegen = { path = "../scratchstack-shapegen" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dependencies]
anyhow.workspace = true
bigdecimal = { workspace = true, features = ["serde", "serde-json"] }
bon.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, optional = true, features = ["derive"] }
regex.workspace = true
scratchstack-cli-utils = { path = "../scratchstack-cli-utils", optional = true }
scratchstack-core.path = "../scratchstack-core"
scratchstack-hakari.path = "../scratchstack-hakari"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
chrono = { workspace = true, features = ["clock"] }
env_logger.workspace = true
pretty_assertions.workspace = true
regex.workspace = true
serde_json.workspace = true
test-log.workspace = true
