[package]
name = "scratchstack-aspen"
description = "AWS IAM policy language (Aspen) parser, representation, and evaluator"
keywords = ["AWS", "IAM", "Aspen"]

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
name = "scratchstack_aspen"

[features]
default = []

# Emit log records that expose the contents of an authorization request: policy documents,
# principals, resources, and session data. Invaluable for debugging an unexpected authorization
# decision, and unacceptable in a deployment whose logs are retained or aggregated. Without this
# feature the records are not merely filtered by log level -- they are not compiled in at all.
sensitive-logging = ["scratchstack-core/sensitive-logging"]

[dependencies]
base64.workspace = true
bon.workspace = true
chrono.workspace = true
ipnet.workspace = true
lazy_static.workspace = true
log.workspace = true
regex.workspace = true
scratchstack-arn.path = "../scratchstack-arn"
scratchstack-aws-principal.path = "../scratchstack-aws-principal"
scratchstack-core = { path = "../scratchstack-core", default-features = false }
scratchstack-hakari = { path = "../scratchstack-hakari" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
env_logger.workspace = true
indoc.workspace = true
pretty_assertions.workspace = true
test-log.workspace = true
