[package]
name = "scratchstack"
description = "AWS-compatible IAM and STS services in a single server"

authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true

[features]
default = ["iam", "sts"]
# Each service is a separate feature so that a deployment can build a binary containing only the
# services it runs, keeping the others' request handlers out of the binary entirely.
iam = ["dep:scratchstack-service-iam"]
sts = ["dep:scratchstack-service-sts"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
env_logger.workspace = true
futures.workspace = true
log.workspace = true
scratchstack-config.workspace = true
scratchstack-hakari.workspace = true
scratchstack-service-common.workspace = true
scratchstack-service-iam = { workspace = true, optional = true }
scratchstack-service-sts = { workspace = true, optional = true }
sqlx = { workspace = true, features = [
    "all-databases",
    "chrono",
    "macros",
    "migrate",
    "runtime-tokio",
    "tls-rustls",
] }
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
tower.workspace = true
