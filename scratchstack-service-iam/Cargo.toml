[package]
name = "scratchstack-service-iam"
description = "An implementation of the AWS Identity and Access Management service"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
log.workspace = true
scratchstack-arn.path = "../scratchstack-arn"
scratchstack-aspen.path = "../scratchstack-aspen"
scratchstack-aws-signature = { path = "../scratchstack-aws-signature", features = [
    "unstable",
] }
scratchstack-aws-principal.path = "../scratchstack-aws-principal"
scratchstack-core = { path = "../scratchstack-core", features = [
    "form",
    "http1",
    "http2",
    "macros",
    "original-uri",
    "query",
    "tls",
    "tokio",
    "tower-log",
    "tracing",
] }
scratchstack-hakari.path = "../scratchstack-hakari"
scratchstack-iam-database.path = "../scratchstack-iam-database"
scratchstack-service-common.path = "../scratchstack-service-common"
scratchstack-shapes-iam.path = "../scratchstack-shapes-iam"
serde_urlencoded.workspace = true
sqlx = { workspace = true, features = [
    "all-databases",
    "chrono",
    "macros",
    "migrate",
    "runtime-tokio",
    "tls-rustls",
] }

[dev-dependencies]
chrono.workspace = true
http-body-util.workspace = true
pretty_assertions.workspace = true
scratchstack-config.path = "../scratchstack-config"
scratchstack-iam-database = { path = "../scratchstack-iam-database", features = [
    "utils",
] }
test-log.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
