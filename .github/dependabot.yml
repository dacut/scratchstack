# Cargo dependencies are NOT handled here; see .github/workflows/dependency-update.yml. Dependabot
# cannot resolve this workspace without rewriting scratchstack-hakari/Cargo.toml, which is
# generated from the resolved dependency graph, and it has no option for reading a manifest without
# updating it (exclude-paths omits the file from the checkout entirely, which makes every crate in
# the workspace unresolvable).
#
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      all-actions:
        patterns:
          - "*"
    schedule:
      interval: weekly
      day: "tuesday"
      time: "04:23"
      timezone: "America/Los_Angeles"
